<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Samyak AI Chatbot</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- Emoji Mart -->
  <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet"/>
</head>

<body>

<div class="bg"></div>

<!-- CHAT TOGGLER -->
<button id="chatbot-toggler">
  <span class="material-symbols-rounded">chat</span>
</button>

<!-- CHAT WINDOW -->
<div class="chatbot">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="left">
      <div class="avatar">AI</div>
      <div>
        <h3>Samyak AI</h3>
        <small>Online</small>
      </div>
    </div>
    <button id="close-chatbot">✕</button>
  </div>

  <!-- BODY -->
  <div class="chat-body"></div>

  <!-- FOOTER -->
  <form class="chat-footer">
    <textarea class="message-input" placeholder="Message..."></textarea>

    <div class="actions">
      <button type="button" id="emoji-btn">😀</button>

      <input type="file" id="file-input" accept="image/*" hidden />
      <button type="button" id="upload-btn">📎</button>

      <button type="button" id="voice-btn">🎤</button>

      <button type="submit">➤</button>
    </div>
  </form>

</div>

<script src="script.js"></script>
</body>
</html>
